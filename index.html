<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3D4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visita Técnica">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Visita Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: prancheta de campo — cabeçalho fixo com etapas, uma coluna de cartões, barra de ação no rodapé */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#16222E; --muted:#5A6977; --line:#D3DBE2;
  --brand:#0B3D4C; --brand-ink:#FFFFFF; --accent:#D4531C; --accent-ink:#FFFFFF;
  --ok:#2D7A4C; --ok-bg:#E3F2E8; --warn:#9A5B12; --warn-bg:#FCF0DA; --err:#B3261E; --err-bg:#FBE5E3;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#17212B; --sunk:#121A22; --ink:#E5EBF0; --muted:#94A3B0; --line:#2A3743;
  --brand:#3FAAB3; --brand-ink:#0B151A; --accent:#F07A45; --accent-ink:#1A0E08;
  --ok:#6CC28F; --ok-bg:#163223; --warn:#E9B062; --warn-bg:#33270F; --err:#F08A80; --err-bg:#3A1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#17212B; --sunk:#121A22; --ink:#E5EBF0; --muted:#94A3B0; --line:#2A3743;
  --brand:#3FAAB3; --brand-ink:#0B151A; --accent:#F07A45; --accent-ink:#1A0E08;
  --ok:#6CC28F; --ok-bg:#163223; --warn:#E9B062; --warn-bg:#33270F; --err:#F08A80; --err-bg:#3A1714; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
.hbtns{display:flex;gap:6px;flex:0 0 auto}
.hbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;font:600 12.5px/1 var(--f-body);padding:8px 8px;border-radius:8px;cursor:pointer}
.hbtn[aria-pressed="true"]{background:rgba(255,255,255,.16)}
.hbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.capa{min-height:100vh;min-height:100dvh;background:linear-gradient(165deg,#0B3D4C 0%,#082D38 62%,#06222B 100%);color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
.capa::before{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:44px;transform:rotate(45deg);border:28px solid rgba(0,160,168,.18)}
.capa::after{content:"";position:absolute;left:-120px;bottom:120px;width:240px;height:240px;border-radius:36px;transform:rotate(45deg);border:22px solid rgba(232,88,32,.14)}
.capa-in{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:22px;max-width:520px;width:100%;margin:0 auto;padding-block:28px 22px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.capa-logo{background:#fff;border-radius:16px;padding:14px 18px;align-self:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.capa-logo img{height:52px;width:auto;display:block}
.capa h1{font-family:var(--f-display);font-size:46px;line-height:.98;margin:18px 0 0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.capa h1 em{font-style:normal;color:#F07A45}
.capa .tag{font-family:var(--f-body);color:#fff;margin:8px 0 0;font-size:16px;opacity:.82;max-width:34ch}
.capa .faixa{display:flex;height:5px;border-radius:3px;overflow:hidden;width:120px}
.capa .faixa i{flex:2;background:#00A0A8}.capa .faixa b{flex:1;background:#E85820}
.capa-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.capa-stats div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.capa-stats b{display:block;font-family:var(--f-mono);font-size:22px}
.capa-stats span{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;font-weight:600}
.capa-acoes{display:grid;gap:10px;margin-top:auto}
.capa-acoes .btn{width:100%;padding:16px;font-size:16px;border-radius:12px}
.capa-acoes .btn.claro{flex-direction:column;gap:2px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#fff}
.capa-acoes .btn.claro small{display:block;font-weight:500;opacity:.75;font-size:13px;margin-top:3px}
.capa-acoes .lado{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.capa-rod{font-size:12.5px;opacity:.6;text-align:center}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.vcard h3{margin:0;font-family:var(--f-display);font-size:19px;line-height:1.15}
.vmeta{color:var(--muted);font-size:14px}
.vrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill.err{background:var(--err-bg);color:var(--err);border-color:transparent}
.pill.info{background:var(--sunk)}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
header.top .wrap{padding-block:12px 0}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandrow h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1.1}
.brandrow small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;opacity:.85;text-transform:none;letter-spacing:0}
.save-ind{font-size:12px;opacity:.85;white-space:nowrap}
nav.steps{display:flex;gap:4px;overflow-x:auto;padding-block:12px 0;scrollbar-width:none}
nav.steps::-webkit-scrollbar{display:none}
nav.steps button{flex:0 0 auto;border:0;background:transparent;color:inherit;opacity:.72;font:600 14px/1 var(--f-body);padding:10px 10px 12px;border-bottom:3px solid transparent;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.steps button .n{font-family:var(--f-mono);font-size:12px;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1.5px solid currentColor}
nav.steps button[aria-current="step"]{opacity:1;border-bottom-color:var(--accent)}
nav.steps button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{padding-block:20px 120px}
.stephead{margin-bottom:16px}
.stephead h2{font-family:var(--f-display);font-size:28px;margin:0;text-wrap:balance;line-height:1.1}
.stephead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.stack{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.grid3.keep{grid-template-columns:repeat(3,minmax(0,1fr))}}
.f{display:grid;gap:5px;min-width:0}
.f>span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f>span em{font-style:normal;color:var(--err)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.sec-title{font-family:var(--f-display);font-size:19px;margin:6px 0 0;letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface);user-select:none}
.chip input:checked+span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;display:grid;gap:12px}
.item-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-head b{font-family:var(--f-display);font-size:18px}
.tag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.btn{font:600 15px/1 var(--f-body);border-radius:8px;padding:12px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--brand)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.brand{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:8px 10px}
.btn.ghost:hover{color:var(--err)}
.btn.add{border-style:dashed;width:100%;color:var(--brand)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.calc{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.note{border-radius:8px;padding:12px 14px;font-size:14.5px;display:grid;gap:4px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.err{background:var(--err-bg);color:var(--err)}
.note.info{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.note b{color:inherit}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.ph-add{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer;padding:6px;background:var(--surface)}
.ph-add input{display:none}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;font-size:14.5px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.rcpt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rcpt:last-child{border-bottom:0}
.rcpt label{display:flex;gap:10px;align-items:center;flex:1;min-width:0;cursor:pointer}
.rcpt input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;accent-color:var(--brand)}
.rcpt .who{min-width:0;overflow-wrap:anywhere}
.rcpt .who small{display:block;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.actions{display:grid;gap:10px}
.sig{border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;width:100%;height:160px;display:block}
footer.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
footer.bar .wrap{display:flex;gap:10px;padding-block:12px}
footer.bar .btn{flex:1}
.status{margin-top:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.check-list{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.cb{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.cb input{width:20px;height:20px;margin-top:1px;flex:0 0 auto;accent-color:var(--brand)}
@media (prefers-reduced-motion:no-preference){.step-enter{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div id="capa" hidden></div>
<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <h1>Visita técnica<small id="hdrSub">Pré-proposta · Verzani & Sandrini</small></h1>
      <div class="hbtns"><button class="hbtn" type="button" id="hInicio">Início</button><button class="hbtn" type="button" id="hVisitas">Visitas</button><button class="hbtn" type="button" id="hAjustes">Ajustes</button></div>
    </div>
    <div class="save-ind" id="saveInd" style="padding-top:6px">Salvo neste aparelho</div>
    <nav class="steps" id="steps" aria-label="Etapas da visita"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer class="bar" id="bar"><div class="wrap">
  <button class="btn" id="btnPrev" type="button">Voltar</button>
  <button class="btn brand" id="btnNext" type="button">Próximo</button>
</div></footer>

const DB=(()=>{let p;
  function abrir(){return p||(p=new Promise((res,rej)=>{const r=indexedDB.open("visita-tecnica",1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("visitas"))d.createObjectStore("visitas",{keyPath:"id"});if(!d.objectStoreNames.contains("fila"))d.createObjectStore("fila",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
  async function tx(st,modo,fn){const d=await abrir();return new Promise((res,rej)=>{const t=d.transaction(st,modo);const req=fn(t.objectStore(st));t.oncomplete=()=>res(req?req.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
  return {get:(st,k)=>tx(st,"readonly",o=>o.get(k)),all:st=>tx(st,"readonly",o=>o.getAll()),put:(st,v)=>tx(st,"readwrite",o=>o.put(v)),del:(st,k)=>tx(st,"readwrite",o=>o.delete(k))};
})();

/* ---------- cálculos ---------- */
function mins(t){if(!t||!/^\d{1,2}:\d{2}$/.test(t))return null;const [h,m]=t.split(":").map(Number);return h*60+m}
function calcPosto(p){
  const a=mins(p.ent),b=mins(p.sai); if(a==null||b==null)return null;
  let dur=(b-a+1440)%1440; if(dur===0)dur=1440;
  const intv=num(p.int); let not=0;
  for(let m=0;m<dur;m++){const t=(a+m)%1440;if(t>=1320||t<300)not++}
  const fator=(p.colab!=null&&String(p.colab).trim()!=="")?num(p.colab):(ESCALAS[p.escala]??1);
  return {trab:Math.max(0,dur-intv),not,efetivo:num(p.qtd)*fator,fator};
}
const colabDe=p=>(p.colab!=null&&String(p.colab).trim()!=="")?num(p.colab):(ESCALAS[p.escala]??1);
const escalaDe=p=>p.escala==="Outros"?(String(p.escalaOutra||"").trim()||"Outros"):p.escala;
const isEdital=()=>S.quadro&&S.quadro.origem==="Edital";
const postosAtivos=()=>isEdital()?[]:S.postos;
const hm=m=>Math.floor(m/60)+"h"+(m%60?String(m%60).padStart(2,"0"):"");
function totais(){
  let postos=0,efetivo=0;postosAtivos().forEach(p=>{postos+=num(p.qtd);efetivo+=num(p.qtd)*colabDe(p)});
  const m2=S.areas.reduce((s,a)=>s+num(a.m2),0);
  const fotos=Math.min(S.fechamento.fotos.length,MAX_FOTOS);
  return {postos,efetivo,m2,fotos,equip:S.equipamentos.reduce((s,e)=>s+num(e.qtd),0)};
}
function alertas(){
  const out=[];
  const sanit=S.areas.filter(a=>["Sanitário","Vestiário"].includes(a.tipo)&&a.fluxo==="Alto");
  if(sanit.length&&!isEdital()&&!S.postos.some(p=>p.insal.startsWith("40")))out.push({k:"warn",t:"Sanitário ou vestiário de grande circulação ("+sanit.map(a=>a.nome||a.tipo).join(", ")+"). Avalie insalubridade em grau máximo (40%) para os postos que atendem essa área (NR-15, Anexo 14 e Súmula 448 do TST)."});
  const alt=S.areas.filter(a=>a.altura);
  if(alt.length&&!S.recursos.exig.includes("NR-35 (trabalho em altura)"))out.push({k:"warn",t:"Há área com trabalho acima de 2 m ("+alt.map(a=>a.nome||a.tipo).join(", ")+"), mas a NR-35 não foi marcada nas exigências."});
  const not=postosAtivos().filter(p=>{const c=calcPosto(p);return c&&c.not>0});
  if(not.length)out.push({k:"info",t:"Postos com horas entre 22h e 5h: "+not.map(p=>p.cargo+" "+p.ent+"–"+p.sai).join("; ")+". A PAC calcula o adicional noturno a partir desses horários."});
  return out;
}

/* ---------- fotos ---------- */
function photoArr(scope){if(scope==="geral")return S.fechamento.fotos;const a=S.areas.find(x=>x.id===scope.split(":")[1]);return a?a.fotos:[]}
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1000;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res({id:uid(),src:c.toDataURL("image/jpeg",0.55),w,h})};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function addPhotos(scope,files){
  const arr=photoArr(scope);
  for(const f of files){if(arr.length>=MAX_FOTOS)break;try{arr.push(await compress(f))}catch(e){}}
  persist();rerenderKeep();
}

/* ---------- assinatura ---------- */
function initSig(){
  const c=document.getElementById("sig");if(!c)return;
  const dpr=window.devicePixelRatio||1,rect=c.getBoundingClientRect();
  c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);
  const g=c.getContext("2d");g.scale(dpr,dpr);g.lineWidth=2.2;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#16222E";
  g.fillStyle="#fff";g.fillRect(0,0,rect.width,rect.height);
  if(S.fechamento.assinatura){const im=new Image();im.onload=()=>g.drawImage(im,0,0,rect.width,rect.height);im.src=S.fechamento.assinatura}
  else{g.fillStyle="#9AA6B1";g.font="14px Barlow, sans-serif";g.fillText("Assine aqui com o dedo",14,24)}
  let drawing=false,blankHint=!S.fechamento.assinatura;
  const pos=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{if(blankHint){g.fillStyle="#fff";g.fillRect(0,0,rect.width,rect.height);blankHint=false}drawing=true;c.setPointerCapture(e.pointerId);const [x,y]=pos(e);g.beginPath();g.moveTo(x,y)};
  c.onpointermove=e=>{if(!drawing)return;const [x,y]=pos(e);g.lineTo(x,y);g.stroke()};
  c.onpointerup=c.onpointercancel=()=>{if(!drawing)return;drawing=false;S.fechamento.assinatura=c.toDataURL("image/png");persist()};
}

function gerarPdf(fx,semFotos){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4",compress:true});
  const W=210,M=14,BRAND=[0,52,68],TEAL=[0,136,144],ORANGE=[232,88,32],INK=[24,36,46],MUT=[96,110,122],SOFT=[243,246,247],LINE=[222,229,233];
  const v=S.visita,t=totais();
  // cabeçalho
  try{doc.addImage(LOGO,"PNG",M,8,16*LOGO_R,16)}catch(e){}
  doc.setTextColor(...BRAND);doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text("RELATÓRIO DE VISITA TÉCNICA",W-M,14,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...MUT);doc.text("Pré-proposta · uso interno do comercial",W-M,19.5,{align:"right"});
  doc.setFillColor(...BRAND);doc.rect(0,29,W,19,"F");

/* ---------- arquivos ---------- */
async function salvarArquivo(filename,data){
  const blob=data instanceof Blob?data:new Blob([data]);
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  setStatus("ok","Arquivo <b>"+esc(filename)+"</b> gerado.");
}
async function compartilhar(){
  try{setStatus("info","Gerando PDF…");const r=await pdfParaEmail(0);const file=new File([r.pdf],nomeArquivo()+".pdf",{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Visita técnica",text:"Visita técnica · "+(S.visita.cliente||"")});setStatus("ok","PDF compartilhado.")}
    else setStatus("info","Este aparelho não permite compartilhar arquivos. Use <b>Baixar PDF</b>.")}
  catch(e){if(e&&e.name==="AbortError")setStatus("info","Compartilhamento cancelado.");else setStatus("err","Não foi possível compartilhar: "+esc(e.message||e))}
}
async function baixarPdf(){setStatus("info","Gerando PDF…");try{const r=await pdfParaEmail(0,(i,n)=>setStatus("info","Otimizando as fotos ("+i+" de "+n+")…"));await salvarArquivo(nomeArquivo()+".pdf",r.semFotos?gerarPdf():r.pdf)}catch(e){setStatus("err","Falha ao gerar o PDF: "+esc(e.message||e))}}
async function baixarXlsx(){try{const arr=XLSX.write(gerarWb(),{type:"array",bookType:"xlsx"});await salvarArquivo(nomeArquivo()+"_PAC.xlsx",new Blob([arr]))}catch(e){setStatus("err","Falha ao gerar a planilha: "+esc(e.message||e))}}
function reencode(f,max,q){return new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res({src:c.toDataURL("image/jpeg",q),w,h})};img.onerror=()=>res(f);img.src=f.src})}
async function pdfReduzido(max,q){const all=S.fechamento.fotos.slice(0,MAX_FOTOS);const m=new Map();for(const f of all)m.set(f.id,await reencode(f,max,q));return gerarPdf(f=>m.get(f.id))}
const LIM_EMAIL=930000;
async function pdfParaEmail(extra,onStep){
  const nFotos=Math.min(S.fechamento.fotos.length,MAX_FOTOS);
  let pdf,b;
  if(!nFotos){pdf=gerarPdf();b=await blobB64(pdf);return {pdf,b64:b,semFotos:false,reduzido:false,cabe:b.length+extra<=LIM_EMAIL}}
  const niveis=[[720,.5],[600,.45],[500,.4],[420,.35],[340,.3]];
  for(let i=0;i<niveis.length;i++){onStep&&onStep(i+1,niveis.length);pdf=await pdfReduzido(...niveis[i]);b=await blobB64(pdf);if(b.length+extra<=LIM_EMAIL)return {pdf,b64:b,semFotos:false,reduzido:true}}
  pdf=gerarPdf(null,true);b=await blobB64(pdf);return {pdf,b64:b,semFotos:true,reduzido:true,cabe:b.length+extra<=LIM_EMAIL};
}
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b)});

async function enviar(){
  if(sending)return;
  const pend=pendencias();if(pend.length){setStatus("warn",pend.join("<br>"));return}
  if(!CFG.url||!CFG.chave){setStatus("warn","Configure o envio em <b>Ajustes</b> antes de enviar: endereço do serviço e chave.");return}
  const to=destinatarios();
  sending=true;const btn=document.getElementById("btnSend");btn.disabled=true;btn.textContent="Enviando…";
  const fim=()=>{sending=false;const b=document.getElementById("btnSend");if(b){b.disabled=!!pendencias().length;b.textContent="Finalizar e enviar por e-mail"}};
  try{
    setStatus("info","Gerando o relatório em PDF…");
    const r=await pdfParaEmail(0,(i,n)=>setStatus("info","Otimizando as fotos ("+i+" de "+n+")…"));
    const xlsxB64=XLSX.write(gerarWb(),{type:"base64",bookType:"xlsx"});
    const fn=nomeArquivo();const {html,txtB}=corpoEmail();
    const item={id:uid(),visitaId:S.id,cliente:S.visita.cliente,criadoEm:new Date().toISOString(),payload:{
      para:to,assunto:`Visita técnica · ${S.visita.cliente}${S.visita.unidade?" · "+S.visita.unidade:""} · ${fmtData(S.visita.data)}`,html,texto:txtB,nome:CFG.remetente||"Visita Técnica",
      anexos:[{nome:fn+".pdf",tipo:"application/pdf",base64:r.b64},{nome:fn+"_PAC.xlsx",tipo:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",base64:xlsxB64}]}};
    await DB.put("fila",item);S.status="fila";await salvarAgora();
    if(!navigator.onLine){setStatus("warn","<b>Sem internet agora.</b> O relatório ficou na fila e será enviado sozinho quando a conexão voltar.");return fim()}
    setStatus("info","Enviando para "+esc(to.join(", "))+"…");
    const res=await processarFila();
    const ainda=await DB.get("fila",item.id);
    if(!ainda)setStatus("ok","<b>Relatório enviado</b> para "+esc(to.join(", "))+" ("+fmtN(r.pdf.size/1024)+" KB).");
    else if(res&&res.erro&&res.erro.servidor)setStatus("err","O serviço de envio recusou: "+esc(res.erro.message)+" O relatório continua na fila.");
    else setStatus("warn","<b>A conexão falhou.</b> O relatório ficou na fila e será enviado sozinho quando a internet voltar.");
  }catch(e){setStatus("err","Falha ao preparar o envio: "+esc(e.message||e))}
  fim();render(true);
}
async function chamarServico(corpo){
  let res;
  try{res=await fetch(CFG.url,{method:"POST",body:JSON.stringify(Object.assign({token:CFG.chave},corpo))})}
  catch(e){throw Object.assign(new Error("Sem conexão com o serviço de envio."),{rede:true})}
  let j;try{j=await res.json()}catch(e){throw Object.assign(new Error("O serviço respondeu de forma inesperada. Confira se o endereço em Ajustes é o da implantação do Apps Script."),{servidor:true})}
  if(!j.ok)throw Object.assign(new Error(j.erro||"Envio recusado."),{servidor:true});
  return j;
}
let processando=false;
async function processarFila(){
  if(processando||!navigator.onLine||!CFG.url||!CFG.chave)return null;
  processando=true;let enviados=0,erro=null;
  try{
    const itens=(await DB.all("fila")).sort((a,b)=>a.criadoEm.localeCompare(b.criadoEm));
    for(const it of itens){
      try{
        await chamarServico(Object.assign({acao:"enviar"},it.payload));
        await DB.del("fila",it.id);enviados++;
        const v=await DB.get("visitas",it.visitaId);
        if(v){v.status="enviada";v.enviadoEm=new Date().toISOString();v.enviadoPara=it.payload.para;await DB.put("visitas",v);if(S&&S.id===v.id){S.status=v.status;S.enviadoEm=v.enviadoEm;S.enviadoPara=v.enviadoPara}}
      }catch(e){erro=e;if(e.servidor){it.erro=e.message;await DB.put("fila",it)}break}
    }
  }finally{processando=false}
  await indicador();
  return {enviados,erro};
}
async function aoVoltarInternet(){
  await indicador();
  const r=await processarFila();
  if(tela==="capa")renderCapa();
  if(r&&r.enviados){if(tela==="form"&&step===STEPS.length-1){setStatus("ok","<b>"+r.enviados+" relatório"+(r.enviados>1?"s enviados":" enviado")+"</b> automaticamente ao voltar a internet.");}render(true)}
}
window.addEventListener("online",aoVoltarInternet);
window.addEventListener("offline",()=>{indicador();if(tela==="capa")renderCapa()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")aoVoltarInternet()});

/* ---------- minhas visitas ---------- */
async function novaVisita(){await salvarAgora();S=normaliza(blank());lastStatus=null;step=0;tela="form";await salvarAgora();render()}
async function abrirVisita(id){await salvarAgora();const v=await DB.get("visitas",id);if(!v)return;S=normaliza(v);lsSet("vt_atual",S.id);lastStatus=null;step=0;tela="form";render()}
async function duplicarVisita(id){const v=await DB.get("visitas",id);if(!v)return;const c=normaliza(JSON.parse(JSON.stringify(v)));c.id=uid();c.status="rascunho";c.exemplo=false;delete c.enviadoEm;delete c.enviadoPara;c.criadoEm=new Date().toISOString();c.visita.cliente=(c.visita.cliente||"Visita")+" (cópia)";await DB.put("visitas",c);render(true)}
function pedirExclusao(b){const id=b.dataset.exc;const box=document.createElement("div");box.className="note warn";box.innerHTML=`<b>Excluir esta visita deste aparelho?</b><div class="row" style="margin-top:6px"><button class="btn primary" type="button" data-excok="${id}">Sim, excluir</button><button class="btn" type="button" id="excNao">Manter</button></div>`;b.closest(".vrow").replaceWith(box)}
async function excluirVisita(id){
  await DB.del("visitas",id);
  for(const f of await DB.all("fila"))if(f.visitaId===id)await DB.del("fila",f.id);
  if(S&&S.id===id){const all=await DB.all("visitas");S=all.length?normaliza(all.sort((a,b)=>(b.atualizadoEm||"").localeCompare(a.atualizadoEm||""))[0]):normaliza(blank());await salvarAgora()}
  await indicador();render(true);
}
async function renderLista(keepScroll){
  const m=document.getElementById("main");
  let all=[],fila=[];try{all=await DB.all("visitas");fila=await DB.all("fila")}catch(e){}
  all.sort((a,b)=>(b.atualizadoEm||"").localeCompare(a.atualizadoEm||""));
  const emFila=new Set(fila.map(f=>f.visitaId));const errFila=Object.fromEntries(fila.filter(f=>f.erro).map(f=>[f.visitaId,f.erro]));
  const pill=v=>emFila.has(v.id)?(errFila[v.id]?`<span class="pill err">Erro no envio</span>`:`<span class="pill warn">Aguardando internet</span>`):v.status==="enviada"?`<span class="pill ok">Enviada em ${fmtDH(v.enviadoEm)}</span>`:`<span class="pill">Rascunho</span>`;
  m.innerHTML=`<div class="step-enter"><div class="stephead"><h2>Minhas visitas</h2><p>Tudo fica guardado neste aparelho, mesmo sem internet.</p></div><div class="stack">
    <button class="btn primary" type="button" id="lNova">+ Nova visita</button>
    ${fila.length?`<div class="note ${Object.keys(errFila).length?"err":"warn"}"><b>${fila.length} envio${fila.length>1?"s":""} na fila.</b><span>${Object.keys(errFila).length?esc(Object.values(errFila)[0]):navigator.onLine?"Toque em tentar agora ou aguarde.":"Será enviado quando a internet voltar."}</span><div class="row" style="margin-top:6px"><button class="btn" type="button" id="filaAgora"${navigator.onLine?"":" disabled"}>Tentar enviar agora</button></div></div>`:""}
    ${all.map(v=>{const t=(v.postos||[]).reduce((s,p)=>s+num(p.qtd)*((p.colab!=null&&String(p.colab).trim()!=="")?num(p.colab):(ESCALAS[p.escala]??1)),0);
      return `<div class="vcard"${S&&S.id===v.id?' style="border-color:var(--brand)"':""}>
      <div class="vrow" style="justify-content:space-between"><h3>${esc(v.visita?.cliente||"Sem cliente")}${v.visita?.unidade?" · "+esc(v.visita.unidade):""}</h3>${pill(v)}</div>
      <div class="vmeta">${esc([v.visita?.cidade,v.visita?.uf].filter(Boolean).join("/")||"Local não informado")} · visita em ${fmtData(v.visita?.data)||"—"}${v.quadro?.origem==="Edital"?" · quadro por edital":t?` · efetivo ${fmtN(t)}`:""}${v.exemplo?" · exemplo":""}</div>
      <div class="vrow"><button class="btn brand" type="button" data-abrir="${v.id}">Abrir</button><button class="btn" type="button" data-dup="${v.id}">Duplicar</button><button class="btn ghost" type="button" data-exc="${v.id}">Excluir</button></div>
    </div>`}).join("")||`<div class="note info">Nenhuma visita salva ainda.</div>`}
  </div></div>`;
  if(!keepScroll)window.scrollTo(0,0);
}
async function renderCapa(){
  const el=document.getElementById("capa");
  let nV=0,nE=0,nF=0;try{const all=await DB.all("visitas");nV=all.filter(v=>!v.exemplo).length;nE=all.filter(v=>v.status==="enviada"&&!v.exemplo).length;nF=(await DB.all("fila")).length}catch(e){}
  const atual=S&&!S.exemplo&&S.status!=="enviada"&&(S.visita.cliente||S.postos.length||S.areas.length)?S:null;
  el.innerHTML=`<div class="capa"><div class="capa-in">
    <div class="capa-logo"><img src="${LOGO}" alt="Verzani & Sandrini"></div>
    <div><h1>Visita<br><em>Técnica</em></h1><p class="tag">Levantamento de pré-proposta para limpeza, portaria, vigilância e manutenção.</p></div>
    <div class="faixa"><i></i><b></b></div>
    <div class="capa-stats"><div><b>${nV}</b><span>Visitas</span></div><div><b>${nE}</b><span>Enviadas</span></div><div><b>${nF}</b><span>Na fila</span></div></div>
    ${!navigator.onLine?`<div class="note warn" style="margin:0">Sem internet. Você pode preencher normalmente, o envio sai quando a conexão voltar.</div>`:""}
    <div class="capa-acoes">
      <button class="btn primary" type="button" id="cNova">+ Nova visita</button>
      ${atual?`<button class="btn claro" type="button" id="cContinuar">Continuar visita<small>${esc(atual.visita.cliente||"Sem cliente")} · ${fmtData(atual.visita.data)}</small></button>`:""}
      <div class="lado"><button class="btn claro" type="button" id="cVisitas">Minhas visitas</button><button class="btn claro" type="button" id="cAjustes">Ajustes</button></div>
    </div>
    <p class="capa-rod">Desenvolvedor: Luciano Evaristo · Versão ${APP_VERSAO}</p>
  </div></div>`;
  window.scrollTo(0,0);
}

    <h3 class="sec-title">Serviço de envio</h3>

      ${fld("Chave",`<input id="cfgChave" type="text" placeholder="A mesma chave escrita no Apps Script" value="${esc(CFG.chave)}" autocomplete="off">`)}
      ${fld("Nome do remetente",`<input id="cfgRem" type="text" value="${esc(CFG.remetente||"")}" autocomplete="off">`)}

    <button class="btn" type="button" id="voltarForm">Voltar para a visita</button>
  </div></div>`;

function lerAjustes(){CFG.url=document.getElementById("cfgUrl").value.trim();CFG.chave=document.getElementById("cfgChave").value.trim();CFG.remetente=document.getElementById("cfgRem").value.trim();salvaCfg()}
function salvarAjustes(){lerAjustes();setStatus("ok","Ajustes salvos.");processarFila()}
async function testarEnvio(){
  lerAjustes();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(CFG.url)){setStatus("err","Cole o endereço completo da implantação, que começa com https://script.google.com/macros/s/ e termina com /exec.");return}
  if(!CFG.chave){setStatus("err","Preencha a chave.");return}
  if(!navigator.onLine){setStatus("warn","Sem internet agora. Teste quando estiver conectado.");return}
  setStatus("info","Testando…");
  try{const j=await chamarServico({acao:"teste"});setStatus("ok","<b>Conexão funcionando.</b> Os e-mails vão sair da conta "+esc(j.conta||"Google configurada")+(j.cota!=null?" (pode enviar mais "+j.cota+" hoje).":"."));processarFila()}
  catch(e){setStatus("err",esc(e.message))}
}
document.getElementById("dl-cargos").innerHTML=CARGOS.map(c=>`<option value="${esc(c)}">`).join("");
document.getElementById("dl-equip").innerHTML=EQUIP.map(c=>`<option value="${esc(c)}">`).join("");
(async function boot(){
  try{
    const id=lsGet("vt_atual");let v=id?await DB.get("visitas",id):null;
    if(!v){const all=await DB.all("visitas");if(all.length){all.sort((a,b)=>(b.atualizadoEm||"").localeCompare(a.atualizadoEm||""));v=all[0]}else{v=exemplo()}}
    S=normaliza(v);await salvarAgora();
  }catch(e){S=normaliza(exemplo())}
  render();indicador();processarFila();
  if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
window.addEventListener("pagehide",()=>{salvarAgora()});
